[package]
name = "toksave"
version = "0.8.5"
edition = "2021"
description = "Zero-config token-saver for AI coding agents (Rust rewrite)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
flate2 = "1"
futures-util = "0.3"
tar = "0.4"
zip = "2"
dirs = "5"
colored = "2"
sha2 = "0.10"
toml_edit = "0.22"
urlencoding = "2.1"
dialoguer = "0.12.0"
indicatif = "0.18.6"
crossterm = "0.29.0"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
strip = true
