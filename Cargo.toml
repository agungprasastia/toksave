[package]
name = "toksave"
version = "1.2.1"
edition = "2024"
description = "Zero-config token-saver for AI coding agents"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
flate2 = "1"
futures-util = "0.3"
tar = "0.4"
zip = "8"
dirs = "7"
colored = "3"
sha2 = "0.11"
toml_edit = "0.25"
urlencoding = "2.1"
dialoguer = "0.12.0"
indicatif = "0.18.6"
crossterm = "0.29.0"
unicode-width = "0.2"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
strip = true
