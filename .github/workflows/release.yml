name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            ext: ""
          - target: linux-arm64
            os: ubuntu-latest
            rust-target: aarch64-unknown-linux-gnu
            ext: ""
          - target: darwin-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            ext: ""
          - target: darwin-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            ext: ""
          - target: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.rust-target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Test
        if: matrix.rust-target != 'aarch64-unknown-linux-gnu'
        run: cargo test --verbose --all-targets

      - name: Build Release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.rust-target }}

      - name: Package (Unix)
        if: matrix.ext == ''
        run: tar czf toksave-${{ matrix.target }}.tar.gz -C target/${{ matrix.rust-target }}/release toksave

      - name: Package (Windows)
        if: matrix.ext == '.exe'
        run: |
          cd target\${{ matrix.rust-target }}\release
          7z a ..\..\..\toksave-${{ matrix.target }}.zip toksave.exe
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: toksave-${{ matrix.target }}
          path: toksave-${{ matrix.target }}.${{ matrix.ext == '.exe' && 'zip' || 'tar.gz' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract Release Notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body: ${{ steps.extract-release-notes.outputs.release_notes }}
